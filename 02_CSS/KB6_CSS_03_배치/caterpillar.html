<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caterpillar</title>
    <style>
      body {

      }
      .chead {
        width: 30px;
        height: 30px;
        background-color: yellowgreen;
        border-radius: 50%;
        position: relative;
      }
      .body1 {
        width: 30px;
        height: 30px;
        background-color: rgb(50, 179, 205);
        border-radius: 50%;
        position: absolute;
        left: 20px;
        top: 10px;
      }
      .body2 {
        width: 30px;
        height: 30px;
        background-color: rgb(177, 120, 218);
        border-radius: 50%;
        position: absolute;
        left: 40px;
        top: 15px;
      }
      .body3 {
        width: 30px;
        height: 30px;
        background-color: rgb(231, 104, 155);
        border-radius: 50%;
        position: absolute;
        left: 55px;
        top: 5px;
      }
      .body4 {
        width: 30px;
        height: 30px;
        background-color: rgb(224, 239, 91);
        border-radius: 50%;
        position: absolute;
        left: 70px;
        top: 10px;
      }
      .eye {
        width: 10px;
        height: 10px;
        background-color: black;
        border-radius: 50%;
        position: absolute;
        left: 5px;
        top: 5px;
        z-index: 1;
      }
      .eyeball {
        width: 4px;
        height: 4px;
        background-color: white;
        border-radius: 50%;
        position: absolute;
        left: 5px;
        top: 7px;
        z-index: 2;
      }
      .eyeball2 {
        width: 2px;
        height: 2px;
        background-color: white;
        border-radius: 50%;
        position: absolute;
        left: 8px;
        top: 9px;
        z-index: 2;

      <div class="eyeball"></div>
      <div class="eyeball2"></div>
    </div>
  </body>
