<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .parent {
        height: 800px;
        width: 800px;
        display: flex;
      }
      .parent > div {
        height: 60px;
        width: 100px;
        line-height: 60px;
        text-align: center;
        font-weight: bold;
      }
      .parent *:nth-child(2n) {
        background-color: pink;
      }

      .parent *:nth-child(2n + 1) {
        background-color: skyblue;
      }
      .parent *:first-child {
        border-radius: 10% 0 0 10%;
      }
      .parent *:last-child {
        border-radius: 0 10% 10% 0;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div>첫번째</div>
      <div>두번째</div>
      <div>세번째</div>
      <div>네번째</div>
      <div>다섯번째</div>
      <div>여섯번째</div>
    </div>
  </body>
</html>
