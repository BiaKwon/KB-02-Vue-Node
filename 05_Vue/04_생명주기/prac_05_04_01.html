<!-- Vue 생명주기 예제 -->
<!-- 서버에서 데이터 받아 화면에 출력 -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <h1>My favorite food lists</h1>
      <button @click="fetchFoods">데이터 받아오기</button>
      <ul>
        <li v-for="(food, idx) in foods" :key="idx">{{food.food}}</li>
      </ul>
    </div>

    <script type="text/javascript" src="https://unpkg.com/vue"></script>
    <script type="text/javascript">
      let vm = Vue.createApp({
        name: 'App',
        data() {
          return {
            foods: [],
          };
        },
        methods: {
          async fetchFoods() {
            try {
              const response = await fetch(
                'https://port-0-tetz-night-back-m5yo5gmx92cc34bc.sel4.cloudtype.app/food/all'
              );
              this.foods = await response.json();
            } catch (e) {
              console.error(e);
            }
          },
        },
      }).mount('#app');
    </script>
  </body>
</html>
