<!-- computed 예제 -->
<!-- 서버에서 데이터 받아 화면에 출력 -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <h1>My favorite food lists using commputed</h1>
      <label for="category">카테고리 선택</label>
      <select id="category" v-model="selectedCategory">
        <option value="all">전체</option>
        <option value="korean">한식</option>
        <option value="japanese">일식</option>
        <option value="chinese">중식</option>
      </select>

      <ul>
        <li v-for="(food, idx) in filteredFoods" :key="idx">{{ food.food }}</li>
      </ul>
    </div>

    <script type="text/javascript" src="https://unpkg.com/vue"></script>
    <script type="text/javascript">
      let vm = Vue.createApp({
        name: 'App',
        data() {
          return {
            foods: [],
            selectedCategory: 'all',
          };
        },
        methods: {
          async fetchFoods() {
            try {
              const response = await fetch(
                'https://port-0-tetz-night-back-m5yo5gmx92cc34bc.sel4.cloudtype.app/food/all'
              );
              this.foods = await response.json();
            } catch (e) {
              console.error(e);
            }
          },
        },
        created() {
          this.fetchFoods();
        },
        computed: {
          filteredFoods() {
            if (this.selectedCategory === 'all') {
              return this.foods;
            }

            return this.foods.filter((food, idx) => {
              return food.category === this.selectedCategory;
            });
          },
        },
      }).mount('#app');
    </script>
  </body>
</html>
