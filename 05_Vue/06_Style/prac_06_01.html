<!-- 클래스 바인딩 -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      .bg-pink {
        background-color: pink;
      }
      .font-white {
        color: white;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <h1 :class="myStyle">배경은 분홍색</h1>
    </div>
    <script>
      const { createApp, ref } = Vue;

      createApp({
        name: 'App',
        data() {
          return {
            myStyle: 'bg-pink font-white',
          };
        },
      }).mount('#app');
    </script>
  </body>
</html>
