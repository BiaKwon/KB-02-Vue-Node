<!-- isLoading 따른 동적 스타일링 (pg. 51) -->
<!-- 서버에서 데이터 받아 화면에 출력 -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .loading-bg {
        background: linear-gradient(-90deg, pink, violet, purple);
        background-size: 400% 400%;
        animation: gradient-wave 5s ease infinite;
      }

      @keyframes gradient-wave {
        0% {
          background-position: 100% 50%;
        }
        50% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 100% 50%;
        }
      }

      .success-bg {
        background-color: skyblue;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div :class="isLoading?'loading-bg':'success-bg'">
        <h1>My favorite food lists using commputed</h1>
        <label for="category">카테고리 선택</label>
        <select id="category" v-model="selectedCategory">
          <option value="all">전체</option>
          <option value="korean">한식</option>
          <option value="japanese">일식</option>
          <option value="chinese">중식</option>
        </select>

        <!-- 데이터 로딩바와 목록은 둘 중 하나만 보여야 함 -->
        <div class="loading-container" v-if="isLoading">
          <div class="spinner"></div>
          <p>데이터 로딩 중...</p>
        </div>

        <ul v-else>
          <li v-for="(food, idx) in filteredFoods" :key="idx">
            {{ food.food }}
          </li>
        </ul>
      </div>
    </div>

    <script type="text/javascript" src="https://unpkg.com/vue"></script>
    <script type="text/javascript">
      let vm = Vue.createApp({
        name: 'App',
        data() {
          return {
            foods: [],
            selectedCategory: 'all',
            isLoading: true,
          };
        },
        methods: {
          async fetchFoods() {
            this.isLoading = true;
            try {
              const response = await fetch(
                'https://port-0-tetz-night-back-m5yo5gmx92cc34bc.sel4.cloudtype.app/food/all'
              );
              this.foods = await response.json();
            } catch (e) {
              console.error(e);
            } finally {
              this.isLoading = false;
            }
          },
        },
        created() {
          this.fetchFoods();
        },
        computed: {
          filteredFoods() {
            if (this.selectedCategory === 'all') {
              return this.foods;
            }

            return this.foods.filter((food, idx) => {
              return food.category === this.selectedCategory;
            });
          },
        },
      }).mount('#app');
    </script>
  </body>
</html>
