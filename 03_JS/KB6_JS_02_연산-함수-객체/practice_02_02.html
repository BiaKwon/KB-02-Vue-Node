<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      for (let i = 1; i < 10; i++) {
        if (i == 4) {
          console.log(i + '단은 생략!');
          continue;
        }
        console.log(i + '단입니다.');
        for (let j = 1; j < 10; j++) {
          console.log(`${i} x ${j} = ${i * j}`);
        }
      }
    </script>
  </head>
  <body></body>
</html>
