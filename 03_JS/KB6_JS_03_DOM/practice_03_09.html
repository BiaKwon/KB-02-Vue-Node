<!-- createElement, appendChild 예제 -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <ul>
      <li>1</li>
      <li>2</li>
    </ul>

    <!-- JS로 html 에 <li>3</li> 추가하는 예제 -->
    <script>
      // ul 태그 선택
      const ulEl = document.querySelector('ul');

      // 자식으로 붙일 태그 만들기
      const liEl = document.createElement('li');
      liEl.textContent = '3';

      // 자식으로 붙임
      ulEl.appendChild(liEl);
    </script>
  </body>
</html>
